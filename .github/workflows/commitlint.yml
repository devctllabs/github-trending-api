name: Commit checks

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened

concurrency:
  group: commitlint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]')
      || (github.event_name == 'push' && github.event.head_commit.author.name != 'dependabot[bot]')
    runs-on: ubuntu-latest

    steps:
      - name: Enforce single-commit PRs
        if: github.event_name == 'pull_request'
        env:
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: test "$PR_COMMIT_COUNT" -eq 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install commitlint
        run: npm install --ignore-scripts --no-save --no-package-lock @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | ./node_modules/.bin/commitlint --verbose

      - name: Validate last commit
        run: ./node_modules/.bin/commitlint --last --verbose
