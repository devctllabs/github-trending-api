name: Update data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-trending-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_PREFERENCE: only-system
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Generate dataset
        id: generate
        shell: bash
        run: |
          set +e
          uv run --frozen github-trending --verbose
          exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [[ "$exit_code" != "0" && "$exit_code" != "2" ]]; then
            exit "$exit_code"
          fi

      - name: Commit generated data
        if: steps.generate.outputs.exit_code == '0' || steps.generate.outputs.exit_code == '2'
        shell: bash
        run: |
          git add data
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
          git push

      - name: Mark degraded update as failed
        if: steps.generate.outputs.exit_code == '2'
        run: exit 1
